<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Echo Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f2f4f7;--white:#fff;--border:#e4e6eb;
  --blue:#2563eb;--blue-bg:#eff4ff;--blue-mid:#bfdbfe;
  --green:#16a34a;--green-bg:#f0fdf4;
  --red:#dc2626;--red-bg:#fff1f2;--red-mid:#fecdd3;
  --text:#111827;--muted:#6b7280;--muted2:#9ca3af;
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:500;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:var(--white);border-radius:20px 20px 0 0;padding:22px 18px calc(22px + var(--sb));width:100%;max-height:85vh;overflow-y:auto}
.sheet h3{font-size:17px;font-weight:600;margin-bottom:6px}
.sheet p{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.5}
.sheet input{width:100%;padding:11px 12px;background:#f9fafb;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-family:'Inter',sans-serif;margin-bottom:11px;outline:none}
.sheet input:focus{border-color:var(--blue)}
.row{display:flex;gap:8px}
.btn-blue{flex:1;padding:12px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;font-family:'Inter',sans-serif}
.btn-grey{padding:12px 16px;background:#f3f4f6;color:var(--muted);border:none;border-radius:10px;font-size:14px;cursor:pointer;font-family:'Inter',sans-serif}
.ai-btns{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.ai-btn{padding:8px 13px;border-radius:8px;border:1.5px solid var(--border);background:var(--white);font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:500}
.ai-btn:active{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.ai-result{font-size:14px;line-height:1.75;color:var(--text)}
.ai-result h4{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
.ai-result h4:first-child{margin-top:0}
.ai-result p{color:var(--muted);margin-bottom:6px}
.ai-result strong{color:var(--text)}

/* SETUP */
#setup{flex:1;overflow-y:auto;padding:16px;padding-bottom:calc(16px + var(--sb))}
#setup::-webkit-scrollbar{display:none}
.setup-top{padding:calc(8px + var(--st)) 0 14px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:20px;font-weight:700;color:var(--blue)}
.ic-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px}
.card{background:var(--white);border-radius:16px;padding:15px;margin-bottom:12px;border:1px solid var(--border)}
.card-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:11px}
.up-row{display:flex;gap:8px}
.up-btn{flex:1;padding:13px 6px;border:1.5px dashed var(--border);border-radius:11px;text-align:center;cursor:pointer;background:transparent}
.up-btn:active{border-color:var(--blue);background:var(--blue-bg)}
.up-btn .ic{font-size:22px;margin-bottom:3px}
.up-btn b{font-size:12px;color:var(--blue);display:block;margin-bottom:1px}
.up-btn small{font-size:11px;color:var(--muted2)}
.chip{display:none;align-items:center;gap:7px;padding:8px 11px;background:#f9fafb;border-radius:8px;border:1px solid var(--border);margin-top:8px}
.chip.show{display:flex}
.chip span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--muted)}
.chip .x{color:var(--muted2);cursor:pointer;font-size:15px;flex-shrink:0}
textarea{width:100%;min-height:88px;padding:11px;background:#f9fafb;border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;line-height:1.6;resize:vertical;outline:none;margin-bottom:10px}
textarea:focus{border-color:var(--blue)}
.start{width:100%;padding:13px;background:var(--blue);color:#fff;border:none;border-radius:12px;font-weight:600;font-size:15px;cursor:pointer;font-family:'Inter',sans-serif}

/* PRACTICE */
#practice{display:none;flex:1;flex-direction:column;overflow:hidden;min-height:0}
#practice.show{display:flex}

.top-bar{flex-shrink:0;padding:calc(9px + var(--st)) 14px 9px;display:flex;align-items:center;gap:9px;background:var(--white);border-bottom:1px solid var(--border)}
.top-title{flex:1;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}

.mode-bar{flex-shrink:0;padding:7px 14px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;overflow-x:auto}
.mode-bar::-webkit-scrollbar{display:none}
.mode-lbl{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.mbtn{padding:5px 11px;border-radius:20px;border:1.5px solid var(--border);background:transparent;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap}
.mbtn.on{background:var(--blue);border-color:var(--blue);color:#fff}

.pill-row{flex-shrink:0;padding:7px 11px;background:var(--white);border-bottom:1px solid var(--border);display:flex;gap:5px;overflow-x:auto}
.pill-row::-webkit-scrollbar{display:none}
.pill{width:34px;height:34px;border-radius:50%;border:2px solid var(--border);background:#f9fafb;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted);transition:all .15s}
.pill.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pill.done{border-color:var(--green);color:var(--green)}

.cards{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:9px}
.cards::-webkit-scrollbar{display:none}

.scard{background:var(--white);border-radius:15px;border:2px solid var(--border);padding:14px;transition:border-color .2s;cursor:pointer}
.scard.on{border-color:var(--blue)}
.scard.g{border-color:var(--green)}
.scard.ok{border-color:#f59e0b}
.scard.bad{border-color:var(--red)}
.scard-top{display:flex;align-items:center;gap:7px;margin-bottom:10px}
.cplay{width:32px;height:32px;border-radius:50%;background:var(--blue);border:none;color:#fff;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.creplay{width:32px;height:32px;border-radius:50%;background:#f3f4f6;border:1px solid var(--border);color:var(--muted);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ts{font-size:11px;color:var(--muted2)}
.badge{margin-left:auto;padding:4px 9px;border-radius:20px;font-size:12px;font-weight:600}
.badge.n{background:#f3f4f6;color:var(--muted)}
.badge.g{background:var(--green-bg);color:var(--green)}
.badge.ok{background:#fffbeb;color:#b45309}
.badge.bad{background:var(--red-bg);color:var(--red)}
.cai{width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;color:var(--muted2)}
.stext{font-size:17px;font-weight:500;line-height:1.5;margin-bottom:6px}
.word{display:inline;border-radius:3px;padding:1px 2px}
.word.h{background:#bbf7d0;color:var(--green)}
.word.m{background:var(--red-mid);color:var(--red)}
.recres{margin-top:9px;display:none}
.recres.show{display:block}
.recplay{display:none;align-items:center;gap:7px;padding:8px 13px;background:var(--blue-bg);border:1px solid var(--blue-mid);border-radius:9px;cursor:pointer;font-size:13px;font-weight:500;color:var(--blue);margin-bottom:7px}
.schips{display:flex;gap:6px;flex-wrap:wrap}
.schip{padding:3px 9px;border-radius:20px;font-size:12px;font-weight:500;background:#f3f4f6;color:var(--muted)}

/* WAVE BAR — compact, all controls in ONE row */
.wave-bar{flex-shrink:0;background:var(--white);border-top:1px solid var(--border);padding:8px 12px calc(8px + var(--sb))}
.wave-meta{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.wave-title{flex:1;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wave-time{font-size:11px;color:var(--muted2)}
.waveform{height:24px;background:#f3f4f6;border-radius:5px;position:relative;overflow:hidden;cursor:pointer;margin-bottom:7px}
.wprog{position:absolute;top:0;left:0;bottom:0;background:rgba(37,99,235,.15);pointer-events:none}
.wbars{position:absolute;inset:0;display:flex;align-items:center;gap:1px;padding:2px 5px;pointer-events:none}
.wb{flex:1;background:#d1d5db;border-radius:1px;min-height:2px}
.wb.p{background:var(--blue);opacity:.8}
/* ALL CONTROLS IN ONE ROW */
.wave-controls{display:flex;align-items:center;gap:6px}
.wc{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:#f9fafb;color:var(--text);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Inter',sans-serif}
.wc.play{width:36px;height:36px;background:var(--blue);border-color:var(--blue);color:#fff;font-size:15px}
.wc.mic{width:36px;height:36px;background:#f97316;border-color:#f97316;color:#fff;font-size:16px}
.wc.mic.rec{background:var(--red);border-color:var(--red);animation:pulse 1s infinite}
.wc.ai{font-size:10px;width:auto;padding:0 8px;border-radius:6px;color:var(--blue);border-color:var(--blue-mid);background:var(--blue-bg)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

.toast{position:fixed;bottom:calc(80px + var(--sb));left:50%;transform:translateX(-50%) translateY(20px);padding:9px 16px;border-radius:20px;font-size:13px;font-weight:500;z-index:400;opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;pointer-events:none;background:#111;color:#fff}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.g{background:var(--green)}
.toast.r{background:var(--red)}
.toast.b{background:var(--blue)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(0,0,0,.15);border-top-color:var(--blue);border-radius:50%;animation:rot .6s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- API MODAL -->
<div class="overlay" id="apiModal">
  <div class="sheet">
    <h3>Gemini API Key</h3>
    <p>Key lưu trong browser, chỉ gửi tới Google Gemini API.</p>
    <input type="password" id="apiKeyInput" placeholder="AIza...">
    <div class="row">
      <button class="btn-blue" id="saveApiBtn">Lưu</button>
      <button class="btn-grey" id="closeApiBtn">Huỷ</button>
    </div>
  </div>
</div>

<!-- AI PANEL -->
<div class="overlay" id="aiPanel">
  <div class="sheet">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <h3 style="font-size:15px">✦ AI Analysis</h3>
      <button id="closeAiBtn" style="background:none;border:none;font-size:19px;cursor:pointer;color:var(--muted)">✕</button>
    </div>
    <div id="aiSelText" style="padding:9px 11px;background:#f9fafb;border-radius:9px;font-size:13px;line-height:1.6;color:#374151;margin-bottom:11px">Chưa chọn câu</div>
    <div class="ai-btns">
      <button class="ai-btn" id="btnT">🌐 Dịch</button>
      <button class="ai-btn" id="btnG">🔍 Ngữ pháp</button>
      <button class="ai-btn" id="btnV">📖 Từ vựng</button>
      <button class="ai-btn" id="btnP">🗣 Phát âm</button>
    </div>
    <div class="ai-result" id="aiOut"></div>
  </div>
</div>

<!-- SETUP -->
<div id="setup">
  <div class="setup-top">
    <div class="logo">Echo Practice</div>
    <button class="ic-btn" id="setupApiBtn">⚙️</button>
  </div>
  
  <div class="card">
    <div class="card-title">Audio</div>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <input type="url" id="audioUrl" placeholder="Paste URL audio (tmpfiles, dropbox...)" 
        style="flex:1;padding:11px 12px;background:#f9fafb;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-family:'Inter',sans-serif;outline:none">
      <button id="loadUrlBtn" style="padding:11px 14px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap">Tải</button>
    </div>
    <div style="text-align:center;font-size:12px;color:var(--muted);margin-bottom:8px">— hoặc —</div>
    <div class="up-btn" id="pickAudio" style="margin-bottom:8px"><div class="ic">🎵</div><b>Upload từ máy</b><small>Mọi định dạng</small></div>
    
    <!-- XÓA BỎ HOÀN TOÀN RÀO CẢN ACCEPT -->
    <input type="file" id="audioInput" style="display:none">
    
    <div class="chip" id="audioChip"><span id="audioName"></span><span class="x" id="rmAudio">✕</span></div>
  </div>
  
  <div class="card">
    <div class="card-title">Phụ đề SRT</div>
    <div class="up-row">
      <div class="up-btn" id="pickSrt"><div class="ic">📄</div><b>Upload SRT</b><small>Mọi định dạng</small></div>
    </div>
    
    <!-- XÓA BỎ HOÀN TOÀN RÀO CẢN ACCEPT -->
    <input type="file" id="srtInput" style="display:none">
    
    <div class="chip" id="srtChip"><span id="srtName"></span><span class="x" id="rmSrt">✕</span></div>
  </div>
  
  <div class="card">
    <div class="card-title">Transcript</div>
    <textarea id="txInput" placeholder="Paste transcript vào đây, hoặc upload SRT ở trên..."></textarea>
    <button class="start" id="startBtn">Bắt đầu luyện tập →</button>
  </div>
</div>

<!-- PRACTICE -->
<div id="practice">
  <div class="top-bar">
    <button class="ic-btn" id="backBtn">←</button>
    <div class="top-title" id="topTitle">Echo Practice</div>
    <button class="ic-btn" id="practApiBtn">⚙️</button>
  </div>
  <div class="mode-bar">
    <span class="mode-lbl">Chế độ:</span>
    <button class="mbtn on" id="modeStop">⏸ Dừng mỗi câu</button>
    <button class="mbtn" id="modeAll">▶ Phát hết</button>
    <button class="mbtn" id="speedBtn" style="margin-left:auto">1.0×</button>
  </div>
  <div class="pill-row" id="pillRow"></div>
  <div class="cards" id="cards"></div>
  <div class="wave-bar">
    <div class="wave-meta">
      <div class="wave-title" id="waveTitle">Chưa có file</div>
      <div class="wave-time" id="waveTime">0:00 / 0:00</div>
    </div>
    <div class="waveform" id="waveform">
      <div class="wprog" id="wprog"></div>
      <div class="wbars" id="wbars"></div>
    </div>
    <div class="wave-controls">
      <button class="wc" id="prevBtn">‹</button>
      <button class="wc" id="skipBackBtn" style="font-size:10px">↺5</button>
      <button class="wc play" id="playBtn">▶</button>
      <button class="wc" id="skipFwdBtn" style="font-size:10px">↻5</button>
      <button class="wc mic" id="micBtn">🎙</button>
      <button class="wc" id="nextBtn">›</button>
      <button class="wc ai" id="aiBtn">✦ AI</button>
    </div>
  </div>
  <audio id="audio" preload="auto" playsinline webkit-playsinline></audio>
</div>

<div class="toast" id="toast"></div>

<script>
// ── STATE ──
let S=[],cur=0,isRec=false,recog=null,mRec=null,recChunks=[],recURLs={};
let speeds=[0.75,1,1.25,1.5],spI=1,playMode='stop',stopTimer=null,srtData=[];
let cleanAudioSrc='';

// ── HELPERS ──
const $=id=>document.getElementById(id);
const audio=$('audio');
function fmt(s){if(!s||isNaN(s))return'0:00';return`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`}
function toast(msg,t=''){const el=$('toast');el.textContent=msg;el.className=`toast ${t} show`;clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2500)}

// ── INIT ──
window.addEventListener('load',()=>{
  genBars();
  if(!localStorage.getItem('gk'))showApi();

  // API modal
  $('saveApiBtn').onclick=()=>{const k=$('apiKeyInput').value.trim();if(k){localStorage.setItem('gk',k);toast('Đã lưu','g')}hideApi()};
  $('closeApiBtn').onclick=hideApi;
  $('apiModal').onclick=e=>{if(e.target.id==='apiModal')hideApi()};
  $('setupApiBtn').onclick=showApi;
  $('practApiBtn').onclick=showApi;

  // AI panel
  $('closeAiBtn').onclick=()=>$('aiPanel').classList.remove('show');
  $('aiPanel').onclick=e=>{if(e.target.id==='aiPanel')$('aiPanel').classList.remove('show')};
  $('btnT').onclick=()=>analyze('translate');
  $('btnG').onclick=()=>analyze('grammar');
  $('btnV').onclick=()=>analyze('vocab');
  $('btnP').onclick=()=>analyze('pronounce');
  $('aiBtn').onclick=()=>$('aiPanel').classList.toggle('show');

  // Setup
  $('loadUrlBtn').onclick=()=>{
    let url=$('audioUrl').value.trim();
    if(!url){toast('Nhập URL trước','r');return}
    if(url.includes('tmpfiles.org')&&!url.includes('/dl/')){
      url=url.replace('tmpfiles.org/','tmpfiles.org/dl/');
    }
    loadAudioUrl(url);
  };
  $('pickAudio').onclick=()=>$('audioInput').click();
  $('pickSrt').onclick=()=>$('srtInput').click();
  $('audioInput').onchange=onAudioFile;
  $('srtInput').onchange=onSrtFile;
  $('rmAudio').onclick=()=>{audio.src='';cleanAudioSrc='';$('audioChip').classList.remove('show');$('audioInput').value=''};
  $('rmSrt').onclick=()=>{srtData=[];$('srtChip').classList.remove('show');$('srtInput').value=''};
  
  $('startBtn').onclick=()=>{
    if(audio.src) {
        try {
            let p = audio.play();
            if (p !== undefined) p.then(() => audio.pause()).catch(()=>{});
            else audio.pause();
        } catch(e) {}
    }
    start();
  };

  // Player
  $('backBtn').onclick=goSetup;
  $('playBtn').onclick=togglePlay;
  $('skipBackBtn').onclick=()=>skip(-5);
  $('skipFwdBtn').onclick=()=>skip(5);
  $('micBtn').onclick=toggleRec;
  $('prevBtn').onclick=()=>go(cur-1);
  $('nextBtn').onclick=()=>go(cur+1);
  $('speedBtn').onclick=cycleSpeed;
  $('waveform').onclick=seekAudio;
  $('modeStop').onclick=()=>setMode('stop');
  $('modeAll').onclick=()=>setMode('all');

  // Audio events
  audio.onended=()=>$('playBtn').textContent='▶';
  audio.ontimeupdate=onTick;
  audio.onloadedmetadata=()=>$('waveTime').textContent=`0:00 / ${fmt(audio.duration)}`;

  fetch('sub.srt').then(r => r.ok ? r.text() : Promise.reject())
    .then(txt => {
      const p = parseSRT(txt);
      if (p.length) {
        srtData = p;
        $('txInput').value = p.map(x => x.text).join('\n');
        $('srtName').textContent = 'sub.srt';
        $('srtChip').classList.add('show');
        audio.src = 'audio.m4a';
        cleanAudioSrc = 'audio.m4a';
        $('audioName').textContent = 'audio.m4a';
        $('audioChip').classList.add('show');
        $('waveTitle').textContent = 'Audio Practice';
        toast('Đã tìm thấy bài học! Hãy dùng file audio.m4a để chạy mượt nhất.', 'g');
      }
    }).catch(() => {});
});

// ── API ──
function showApi(){$('apiKeyInput').value=localStorage.getItem('gk')||'';$('apiModal').classList.add('show')}
function hideApi(){$('apiModal').classList.remove('show')}

// ── BARS ──
function genBars(){
  const c=$('wbars');c.innerHTML='';
  for(let i=0;i<55;i++){const b=document.createElement('div');b.className='wb';b.style.height=(15+Math.random()*70)+'%';c.appendChild(b)}
}

// ── FILES ──
function loadAudioUrl(url){
  cleanAudioSrc=url;
  audio.src=url;
  audio.load();
  const name=url.split('/').pop().replace(/\.[^.]+$/,'');
  $('audioName').textContent=url;$('audioChip').classList.add('show');
  $('waveTitle').textContent=name;$('topTitle').textContent=name;
  genBars();toast('Audio đang tải...','b');
  audio.oncanplay=()=>toast('Audio sẵn sàng!','g');
}
function onAudioFile(e){
  const f=e.target.files[0];if(!f)return;
  cleanAudioSrc=URL.createObjectURL(f);
  audio.src=cleanAudioSrc;
  const n=f.name.replace(/\.[^.]+$/,'');
  $('audioName').textContent=f.name;$('audioChip').classList.add('show');
  $('waveTitle').textContent=n;$('topTitle').textContent=n;
  genBars();toast('Audio đã tải','g');
}
function onSrtFile(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    const p=parseSRT(ev.target.result);
    if(p.length){srtData=p;$('txInput').value=p.map(x=>x.text).join('\n');$('srtName').textContent=f.name;$('srtChip').classList.add('show');toast(`SRT: ${p.length} câu`,'b')}
    else{$('txInput').value=ev.target.result;$('srtName').textContent=f.name;$('srtChip').classList.add('show')}
  };
  r.readAsText(f,'UTF-8');
}

function parseSRT(txt){
  const res=[];
  txt.replace(/\r\n/g,'\n').trim().split(/\n\n+/).forEach(blk=>{
    const lines=blk.split('\n').map(l=>l.trim()).filter(Boolean);
    const ts=lines.find(l=>l.includes('-->'));
    if(!ts) return;
    const [s,e] = ts.split('-->').map(x => x.trim());
    const text=lines.filter(l=>!l.includes('-->')&&!/^\d+$/.test(l)).join(' ').replace(/<[^>]+>/g,'').trim();
    if(text) res.push({start: pt(s), end: pt(e), text});
  });
  return res;
}

function pt(s){
  s = s.replace(/[^0-9:,.]/g, '').replace(',', '.');
  const p = s.split(':');
  if (p.length === 3) return parseInt(p[0], 10) * 3600 + parseInt(p[1], 10) * 60 + parseFloat(p[2]);
  if (p.length === 2) return parseInt(p[0], 10) * 60 + parseFloat(p[1]);
  return parseFloat(p[0]) || 0;
}

// ── START ──
function start(){
  const raw=$('txInput').value.trim();
  if(!raw){toast('Nhập transcript trước','r');return}
  if(srtData.length){S=srtData.map(x=>({text:x.text,start:x.start,end:x.end}))}
  else{
    const lines=raw.split('\n').map(l=>l.trim()).filter(l=>l.length>2);
    S=lines.length>1?lines.map(t=>({text:t,start:null,end:null})):(raw.match(/[^.!?]+[.!?]+/g)||[raw]).map(t=>({text:t.trim(),start:null,end:null})).filter(x=>x.text.length>2);
  }
  if(!S.length){toast('Không phân tích được','r');return}
  buildUI();
  $('setup').style.display='none';
  $('practice').classList.add('show');
  toast(`${S.length} câu sẵn sàng!`,'g');
  setTimeout(()=>select(0,false),150);
}
function goSetup(){
  $('setup').style.display='';$('practice').classList.remove('show');

}

// ── BUILD UI ──
function buildUI(){
  const pills=$('pillRow'),cards=$('cards');
  pills.innerHTML='';cards.innerHTML='';
  S.forEach((s,i)=>{
    const p=document.createElement('div');
    p.className='pill';p.textContent=i+1;p.dataset.i=i;

    const c=document.createElement('div');
    c.className='scard';c.id='sc'+i;c.dataset.i=i;
    const ts=s.start!==null?`<span class="ts">${fmt(s.start)}</span>`:'';
    c.innerHTML=`
      <div class="scard-top">
        <button class="cplay" data-i="${i}" aria-label="Phát">▶</button>

        ${ts}
        <div class="badge n" id="badge${i}">🎙 —</div>

      <div class="recres" id="rr${i}">
        <div class="recplay" id="rp${i}">▶ Your Recording</div>
        <div class="schips" id="chips${i}"></div>

    c.querySelector('.cplay').addEventListener('click',e=>{e.stopPropagation();playSeg(i)});

}
function words(text,idx){
  return text.split(' ').map(w=>`<span class="word" data-w="${w.toLowerCase().replace(/[^a-z]/g,'')}" data-i="${idx}">${w}</span>`).join(' ');
}

// ── SELECT ──
function select(i,autoPlay=true){
  if(i<0||i>=S.length)return;
  cur=i;
  document.querySelectorAll('.pill').forEach((p,j)=>{p.classList.toggle('on',j===i);if(j===i)p.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})});
  document.querySelectorAll('.scard').forEach((c,j)=>c.classList.toggle('on',j===i));
  const card=document.getElementById('sc'+i);
  if(card)setTimeout(()=>card.scrollIntoView({block:'nearest',behavior:'smooth'}),50);
  $('aiSelText').textContent=S[i].text;
  if(autoPlay)playSeg(i);
}

// ── PLAY SEGMENT ──
function playSeg(i){
  const s=S[i];
  if(stopTimer){clearInterval(stopTimer);stopTimer=null}

  if(s.start===null){
    audio.play().catch(()=>{});
    $('playBtn').textContent='⏸';
    return;
  }

  const startStop=()=>{
    if(playMode==='stop'){
      if(stopTimer){clearInterval(stopTimer);stopTimer=null}
      stopTimer=setInterval(()=>{
        if(audio.currentTime>=s.end-0.05){
          audio.pause();$('playBtn').textContent='▶';
          clearInterval(stopTimer);stopTimer=null;
        }
      },80);
    }
  };

  const attemptPlay = () => {
    audio.currentTime = s.start;
    audio.onseeked=function(){
      audio.onseeked=null;
      audio.play().then(()=>{
        $('playBtn').textContent='⏸';
        startStop();
      }).catch(()=>{});
    };
    setTimeout(()=>{
      if(audio.onseeked){
        audio.onseeked=null;
        audio.play().then(()=>{
          $('playBtn').textContent='⏸';
          startStop();
        }).catch(()=>{});
      }
    }, 200);
  };

  if (audio.readyState >= 1) { 
    attemptPlay();
  } else {
    audio.load();
    audio.onloadedmetadata = () => {
      audio.onloadedmetadata = null;
      attemptPlay();
    };
    setTimeout(() => { if(audio.onloadedmetadata){ audio.onloadedmetadata=null; attemptPlay(); } }, 1000);
  }
}

function setMode(m){
  playMode=m;
  $('modeStop').classList.toggle('on',m==='stop');
  $('modeAll').classList.toggle('on',m==='all');
  if(stopTimer){clearInterval(stopTimer);stopTimer=null}
}

// ── PLAYER ──
function togglePlay(){if(audio.paused){audio.play().catch(()=>{});$('playBtn').textContent='⏸'}else{audio.pause();$('playBtn').textContent='▶'}}
function skip(s){audio.currentTime=Math.max(0,Math.min(audio.duration||0,audio.currentTime+s))}
function cycleSpeed(){spI=(spI+1)%speeds.length;audio.playbackRate=speeds[spI];$('speedBtn').textContent=speeds[spI]+'×'}
function seekAudio(e){
  if(!audio.duration)return;
  if(stopTimer){clearInterval(stopTimer);stopTimer=null}
  const r=e.currentTarget.getBoundingClientRect();
  audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;
}
function go(i){if(i>=0&&i<S.length)select(i,true);else if(i>=S.length)toast('Hết câu! 🎉','g')}

function onTick(){
  const c=audio.currentTime,d=audio.duration||0;
  $('waveTime').textContent=`${fmt(c)} / ${fmt(d)}`;
  const pct=d?(c/d)*100:0;
  $('wprog').style.width=pct+'%';
  document.querySelectorAll('.wb').forEach((b,i,a)=>b.classList.toggle('p',i<Math.floor((pct/100)*a.length)));
  if(srtData.length&&playMode==='all'&&!stopTimer){
    const idx=srtData.findIndex(s=>c>=s.start&&c<=s.end);
    if(idx!==-1&&idx!==cur)select(idx,false);
  }
}

// ── RECORD ──
function toggleRec(){isRec?stopRec():startRec()}
function startRec(){
  recChunks=[];
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    mRec=new MediaRecorder(stream);
    mRec.ondataavailable=e=>{if(e.data.size>0)recChunks.push(e.data)};
    mRec.onstop=()=>{
      const blob=new Blob(recChunks,{type:'audio/webm'});
      if(recURLs[cur])URL.revokeObjectURL(recURLs[cur]);
      recURLs[cur]=URL.createObjectURL(blob);
      const rp=$('rp'+cur);if(rp)rp.style.display='flex';
      stream.getTracks().forEach(t=>t.stop());
    };
    mRec.start();
  }).catch(err=>toast('Lỗi mic: '+err.message,'r'));

  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){
    recog=new SR();
    recog.lang='en-US';recog.continuous=false;recog.interimResults=false;recog.maxAlternatives=1;
    recog.onresult=e=>score(e.results[0][0].transcript,e.results[0][0].confidence);
    recog.onerror=()=>{};
    recog.onend=()=>{if(isRec)stopRec()};
    recog.start();
  }
  isRec=true;$('micBtn').classList.add('rec');$('micBtn').textContent='⏹';
}
function stopRec(){
  if(recog){recog.stop();recog=null}
  if(mRec&&mRec.state!=='inactive')mRec.stop();
  isRec=false;$('micBtn').classList.remove('rec');$('micBtn').textContent='🎙';
}
function playRec(i){const u=recURLs[i];if(u)new Audio(u).play()}

function score(userTxt,conf){
  const tw=S[cur].text.toLowerCase().replace(/[^a-z\s]/g,'').split(/\s+/).filter(Boolean);
  const uw=userTxt.toLowerCase().replace(/[^a-z\s]/g,'').split(/\s+/).filter(Boolean);
  let hits=0;const hi=new Set();
  uw.forEach(w=>{const j=tw.findIndex((t,k)=>t===w&&!hi.has(k));if(j!==-1){hits++;hi.add(j)}});
  const acc=tw.length?Math.round(hits/tw.length*100):0;
  const com=tw.length?Math.round(Math.min(uw.length/tw.length,1)*100):0;
  const flu=Math.round((conf||.7)*100);
  const ov=Math.round(acc*.5+flu*.3+com*.2);
  const g=ov>=80?'g':ov>=60?'ok':'bad';
  document.querySelectorAll(`[data-i="${cur}"].word`).forEach(el=>{
    el.classList.remove('h','m');
    if(uw.length)el.classList.add(uw.includes(el.dataset.w)?'h':'m');
  });
  const badge=$('badge'+cur);
  if(badge){badge.className=`badge ${g}`;badge.textContent=`🎙 ${ov}%`}
  const sc=$('sc'+cur);
  if(sc){sc.classList.remove('g','ok','bad');sc.classList.add(g)}
  const pill=document.querySelector(`.pill[data-i="${cur}"]`);
  if(pill){pill.classList.add('done');pill.style.cssText+=`;border-color:${g==='g'?'var(--green)':g==='ok'?'#f59e0b':'var(--red)'}`;pill.style.color=g==='g'?'var(--green)':g==='ok'?'#b45309':'var(--red)'}
  const ch=$('chips'+cur);
  if(ch)ch.innerHTML=`<span class="schip">Acc ${acc}%</span><span class="schip">Flu ${flu}%</span><span class="schip">Com ${com}%</span><span class="schip" style="font-style:italic">"${userTxt}"</span>`;
  const rr=$('rr'+cur);if(rr)rr.classList.add('show');
  toast(`${ov}% — ${ov>=80?'Xuất sắc!':ov>=60?'Tốt!':'Luyện thêm nhé'}`,ov>=80?'g':ov>=60?'b':'r');
}

function openAI(i){$('aiSelText').textContent=S[i].text;$('aiPanel').classList.add('show')}
async function analyze(type){
  const key=localStorage.getItem('gk');if(!key){showApi();return}

  const pm={
    translate:`Dịch câu sau sang tiếng Việt tự nhiên, giải thích cụm từ chính.\nCâu: "${txt}"\n\n## Bản dịch\n## Cụm từ chính`,
    grammar:`Phân tích ngữ pháp cho người học A2-B1.\nCâu: "${txt}"\n\n## Cấu trúc\n## Thì/Thể\n## Ví dụ tương tự`,
    vocab:`Chọn 4-6 từ quan trọng nhất.\nCâu: "${txt}"\n\n## Từ vựng\n[từ]: [nghĩa VN] | Ví dụ: [...] | Đi cùng: [...]`,
    pronounce:`Hướng dẫn phát âm cho người Việt A2-B1.\nCâu: "${txt}"\n\n## IPA\n## Trọng âm câu\n## Nối âm\n## Lỗi người Việt hay mắc`
  };
  try{
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${key}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:pm[type]}]}]})
    });
    const data=await res.json();
    if(data.error)throw new Error(data.error.message);
    const raw=data.candidates?.[0]?.content?.parts?.[0]?.text||'';
    $('aiOut').innerHTML=renderMD(raw);
  }catch(e){toast('Lỗi: '+e.message,'r')}
  finally{btn.textContent=orig;btn.disabled=false}
}
function renderMD(t){
  return t.replace(/^## (.+)$/gm,'<h4>$1</h4>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>');
}
